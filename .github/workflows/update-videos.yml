name: Update Content (Videos & Listings)

on:
  schedule:
    # Run daily at 6 AM UTC (adjust timezone as needed)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local
        run: |
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env.local
          echo "YOUTUBE_CHANNEL_ID=${{ secrets.YOUTUBE_CHANNEL_ID }}" >> .env.local
          if [ -n "${{ secrets.RAPIDAPI_KEY }}" ]; then
            echo "RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}" >> .env.local
          fi

      - name: Update videos from YouTube
        run: npm run update-videos

      - name: Update listings from Zillow
        run: npm run update-listings

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lib/videos-data.ts lib/zillow-api.ts
          git commit -m "🎬🏠 Auto-update content [$(date +'%Y-%m-%d %H:%M')]"
          git push

      - name: Deploy to production (if using Vercel)
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          echo "Content updated! Deployment will be triggered automatically."
          echo "Videos count: $(grep -o '"id":' lib/videos-data.ts | wc -l)"
          echo "Listings count: $(grep -o '"zpid":' lib/zillow-api.ts | wc -l)"